<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Javier Violante project image showcase" />
    <title>Image Showcase | Javier Violante</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #ffffff;
        --muted: #b9c5d3;
        --page: #102037;
        --panel: #0b1526;
        --line: #26364b;
        --accent: #7fccbd;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--page);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header, nav, footer { background: var(--panel); }
      header { padding: 35px 5% 25px; }
      header h1 { margin: 0; font-size: 1.1rem; font-weight: 400; }
      nav { padding: 10px 5% 30px; }
      nav a { margin-right: 14px; color: var(--accent); text-decoration: none; }
      nav a:hover, nav a:focus { text-decoration: underline; }

      main { max-width: 1280px; margin: auto; padding: 72px 5% 88px; }
      .heading { max-width: 680px; margin: 0 auto 36px; }
      .kicker { margin: 0 0 8px; color: var(--accent); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
      h2 { margin: 0 0 10px; font-size: 2rem; font-weight: 500; }
      .intro { margin: 0; color: var(--muted); }
      .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
      figure { margin: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
      figure img { display: block; width: 100%; height: 260px; object-fit: cover; transition: transform 220ms ease; }
      figure:hover img { transform: scale(1.04); }
      figcaption { padding: 13px 16px; }
      footer { padding: 35px 5% 25px; color: var(--muted); }

      @media (max-width: 600px) {
        main { padding: 52px 5% 64px; }
        .gallery { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header><h1>Javier Violante</h1></header>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/showcase/" aria-current="page">Showcase</a>
      <a href="https://www.linkedin.com/in/javierviolante/">LinkedIn</a>
      <a href="https://github.com/Cerestar">GitHub</a>
    </nav>
    <main>
      <div class="heading">
        <p class="kicker">Selected work</p>
        <h2>Image Showcase</h2>
        <p class="intro">A visual look at projects, experiments, and things I have built.</p>
      </div>
      <div class="gallery">
        <figure><img src="/images/welcome.png" alt="Portfolio welcome artwork" /><figcaption>Welcome</figcaption></figure>
        <figure><img src="/images/server-img.png" alt="Server project preview" /><figcaption>Server</figcaption></figure>
        <figure><img src="/images/sear-img.jpg" alt="Search project preview" /><figcaption>Search</figcaption></figure>
        <figure><img src="/images/kalios-img.png" alt="Kalios project preview" /><figcaption>Kalios</figcaption></figure>
        <figure><img src="/images/bot-img.png" alt="Bot project preview" /><figcaption>Bot</figcaption></figure>
        <figure><img src="/images/asteroids-img.png" alt="Asteroids project preview" /><figcaption>Asteroids</figcaption></figure>
        <figure><img src="/images/ac-img.png" alt="Asteroids C++ project preview" /><figcaption>Asteroids C++</figcaption></figure>
      </div>
    </main>
    <footer>©2022 by Javier Violante.</footer>
  </body>
</html>
